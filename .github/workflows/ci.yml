name: CI

on:
  push:
    branches: [main]
  pull_request:

# 新 push 自动取消本分支尚未完成的旧 run，避免排队堆积。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.label }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15   # Apple Silicon
            label: arm64
          - os: macos-13   # Intel
            label: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Use newest installed Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] && sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
