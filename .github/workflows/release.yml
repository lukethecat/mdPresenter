name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# 发布任务不取消（避免并发标签互相打断）。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Universal .app + DMG
    timeout-minutes: 45
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Use newest installed Xcode (needed for the macOS 26 glass API)
        run: |
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] && sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Build universal binary (arm64 + x86_64)
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Assemble DMG (app + Applications shortcut + checksum)
        run: UNIVERSAL=1 ./scripts/make-dmg.sh

      - name: Verify bundle
        run: |
          lipo -info .build/app-bundle/mdPresenter.app/Contents/MacOS/Presenter
          hdiutil verify dist/mdPresenter-macOS-universal.dmg
          ls -la dist/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mdPresenter-macOS-universal.dmg
            dist/mdPresenter-macOS-universal.dmg.sha256
            .build/app-bundle/mdPresenter.app
          generate_release_notes: true
